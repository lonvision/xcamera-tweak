name: build-tweak

on:
  workflow_dispatch:
  push:
    paths:
      - 'tweak/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version || true
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Compile tweak dylib (arm64 + arm64e)
        run: |
          chmod +x tweak/compile.sh
          OUT_DIR="$GITHUB_WORKSPACE/out" ./tweak/compile.sh

      - name: Verify dylib
        run: |
          set -e
          xcrun lipo -info out/KAlertXC.dylib
          xcrun vtool -show-build out/KAlertXC.dylib || true
          file out/KAlertXC.dylib
          xcrun nm -gU out/KAlertXC.dylib | head -20 || true

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: KAlertXC-dylib
          path: out/KAlertXC.dylib
          if-no-files-found: error
